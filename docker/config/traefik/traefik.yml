# ============================================================================
# TRAEFIK CONFIGURATION - Finance Hub
# Reverse proxy with automatic HTTPS
# ============================================================================

# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: false  # Enable in development only
  insecure: false

# Log configuration
log:
  level: INFO
  format: common

# Access log
accessLog:
  format: common
  bufferingSize: 100

# Entry points
entryPoints:
  # HTTP - redirect to HTTPS
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file

# Certificate resolvers
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
      # Uncomment for staging during development
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

# Providers
providers:
  # Docker provider
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: hubcompta-network

  # File provider for middleware configurations
  file:
    directory: /etc/traefik/dynamic
    watch: true
