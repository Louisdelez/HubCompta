# ============================================================================
# NGINX SERVER CONFIGURATION - Finance Hub
# SPA routing with API proxy
# ============================================================================

# Upstream for API backend
upstream backend {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Document root
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;

    # -------------------------------------------------------------------------
    # API Proxy
    # -------------------------------------------------------------------------
    location /api/ {
        # Rate limiting for API
        limit_req zone=api burst=50 nodelay;

        # Proxy to backend
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support (for future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # -------------------------------------------------------------------------
    # Health Check Proxy
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't apply rate limiting to health checks
        limit_req off;
    }

    # -------------------------------------------------------------------------
    # Static Assets
    # -------------------------------------------------------------------------

    # Immutable assets (hashed filenames from Vite)
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Security headers for static files too
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service worker and manifest (don't cache aggressively)
    location ~* ^/(sw\.js|manifest\.json|robots\.txt)$ {
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # -------------------------------------------------------------------------
    # SPA Routing
    # -------------------------------------------------------------------------

    # Main entry point
    location / {
        try_files $uri $uri/ /index.html;

        # No caching for HTML (always fetch latest)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # -------------------------------------------------------------------------
    # Error Pages
    # -------------------------------------------------------------------------

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # -------------------------------------------------------------------------
    # Security: Block access to sensitive files
    # -------------------------------------------------------------------------

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(\.git|\.env|\.htaccess|\.htpasswd) {
        deny all;
    }
}
